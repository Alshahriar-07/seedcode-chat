<body data-page="about">

    <!-- ============ Sidebar (injected by navigation.js) ============ -->

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>

      <h1 class="header-title" id="header-title">About</h1>

    <!-- ============ Main / page ============ -->
    <main class="main" id="chat-area" tabindex="-1">
      <div class="page-view" id="page-view">
        <!-- Crawlable description (kept even when JS renders the page). -->
        <section class="about-seo" aria-label="About Seed Code Chat">
          <p><strong>Seed Code Chat</strong> is a free AI chatbot and online AI assistant built on the Seed Code platform. Ask questions, explore free AI models, and get intelligent answers for writing, research, and AI coding. The companion <strong>Seed Code CLI</strong> brings AI tools and an AI coding assistant to your terminal.</p>
        </section>
        <div class="page-shell" id="page-shell"></div>
      </div>
    </main>
